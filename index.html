<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME YA FILM - CHILAGU LEGACY</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: #000; 
        color: #fff; 
        font-family: 'Arial Black', Arial; 
        text-align: center; 
        padding: 20px;
    }
    h2 { margin-bottom: 20px; color: #ff0000; }
    input { 
        display: block; 
        margin: 10px auto; 
        padding: 12px; 
        width: 300px; 
        background: #111; 
        border: 2px solid #ff0000; 
        color: #fff; 
        font-size: 16px;
    }
    button { 
        padding: 15px 30px; 
        background: red; 
        color: #fff; 
        border: none; 
        cursor: pointer; 
        font-size: 18px;
        margin-top: 20px;
        font-weight: bold;
    }
    button:hover { background: #ff3333; }

    .players { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        margin-top: 30px; 
        gap: 15px;
    }
    .player {
        width: 140px; 
        height: 140px; 
        background: #1a1a1a; 
        border: 3px solid #555; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        transition: 0.4s;
        font-size: 14px;
        border-radius: 10px;
    }
    .player.joined { 
        border-color: #00ff00; 
        box-shadow: 0 0 20px #00ff00; 
        background: #003300;
    }
    .player.shot { 
        opacity: 0.2; 
        filter: grayscale(100%); 
        pointer-events: none; 
        border-color: #ff0000;
        background: #330000;
    }

    #timer-msg { 
        color: yellow; 
        font-size: 22px; 
        margin-bottom: 20px;
        min-height: 30px;
    }
    @keyframes blink {
     0% { opacity: 1; }
     50% { opacity: 0.2; }
     100% { opacity: 1; }
    }
</style>
</head>
<body>

<div id="register-screen">
    <h2>SAJILI WACHEZAJI 7 ILI KUVUNJA SHERIA YA MCHEZO</h2>
    <input type="text" id="p1" placeholder="Mchezaji 1">
    <input type="text" id="p2" placeholder="Mchezaji 2">
    <input type="text" id="p3" placeholder="Mchezaji 3">
    <input type="text" id="p4" placeholder="Mchezaji 4">
    <input type="text" id="p5" placeholder="Mchezaji 5">
    <input type="text" id="p6" placeholder="Mchezaji 6">
    <input type="text" id="p7" placeholder="Mchezaji 7">
    <button onclick="registerPlayers()">ANZA MFUMO</button>
</div>

<div id="game-screen" style="display:none;">
    <h2 id="timer-msg">PLEASE WAIT... SYNCING PLAYERS</h2>
    
    <div class="players">
        <div class="player" id="p1"><span id="p1-title">Player 1</span></div>
        <div class="player" id="p2"><span id="p2-title">Player 2</span></div>
        <div class="player" id="p3"><span id="p3-title">Player 3</span></div>
        <div class="player" id="p4"><span id="p4-title">Player 4</span></div>
        <div class="player" id="p5"><span id="p5-title">Player 5</span></div>
        <div class="player" id="p6"><span id="p6-title">Player 6</span></div>
        <div class="player" id="p7"><span id="p7-title">Player 7</span></div>
    </div>
</div>

<script>
// BADILI SCREEN
function nextScreen(hideId, showId) {
    document.getElementById(hideId).style.display = "none";
    document.getElementById(showId).style.display = "block";
}

// 1. KUSAJILI WACHEZAJI 7
function registerPlayers() {
    const playersData = [];
    let allFilled = true;

    for (let i = 1; i <= 7; i++) {
        const nameValue = document.getElementById('p' + i).value.trim();
        
        if (nameValue === "") {
            allFilled = false;
            break;
        }
        playersData.push(nameValue);
    }

    if (!allFilled) {
        alert("MFUMO UMEGOMA: Lazima wachezaji wote 7 wajaze majina ili kuvunja sheria ya mchezo!");
        return;
    }

    for (let i = 1; i <= 7; i++) {
        document.getElementById('p' + i + '-title').innerText = playersData[i - 1];
    }

    nextScreen('register-screen', 'game-screen');
    document.getElementById('p1').classList.add('joined');
    startOfficialEngine(playersData);
}

// 2. ENGINE YA KUINGIZA WACHEZAJI KWA MPANGO
function startOfficialEngine(playersData) {
    let activeCount = 2; // p1 tayari joined
    let total = 7;
    let secondsLeft = 30;

    const engineInterval = setInterval(function() {
        secondsLeft--;
        document.getElementById('timer-msg').innerText = 
            "PLEASE WAIT... SYNCING NEXT SESSION IN " + secondsLeft + "s";

        if (secondsLeft <= 0) {
            if (activeCount <= total) {
                document.getElementById('p' + activeCount).classList.add('joined');
                activeCount++;
                secondsLeft = 30;
            } else {
                // WOTE WAMESHAINGIA. ANZA ACTION
                clearInterval(engineInterval);
                startActionPhase(playersData);
            }
        }
    }, 1000);
}

// 3. ACTION PHASE - HALI INABADILIKA NDANI
function startActionPhase(playersData) {
    document.getElementById('timer-msg').innerText = "ACTION! HALI IMEBADILIKA NDANI!";
    document.getElementById('timer-msg').style.color = "#ff0000";
    document.getElementById('timer-msg').style.fontSize = "26px";
    document.getElementById('timer-msg').style.animation = "blink 0.5s infinite";

    enableShooting(playersData);
    console.log("ACTION STARTED. Wasanii 7 wamo ndani. Tayari kwa kushot.");
}

// 4. MFUMO WA KUSHOT WASANII
function enableShooting(playersData) {
    for (let i = 1; i <= 7; i++) {
        const playerEl = document.getElementById('p' + i);
        playerEl.style.cursor = "crosshair";
        playerEl.onclick = function() {
            shootArtist(i, playersData[i-1]);
        }
    }
}

// 5. ACTION YA KUSHOT
function shootArtist(playerIndex, playerName) {
    const playerEl = document.getElementById('p' + playerIndex);
    
    if (playerEl.classList.contains('shot')) return;

    playerEl.classList.add('shot');
    alert("BOOM! " + playerName + " AMESHOTIWA!");
    document.getElementById('timer-msg').innerText = playerName + " DOWN! ENDELEA KUSHOT!";
}
</script>

</body>
</html>
